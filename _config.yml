title: Allamaprabhu Ani
description: Allamaprabhu Ani is a PhD candidate in computational mechanics, phase-field fracture, and scientific machine learning at City St George's, University of London.
url: https://allamaprabhuani.github.io
author:
  name: Allamaprabhu Ani
  email: allamaprabhuani@gmail.com

# Fallback image when a page has no `image` in its frontmatter
# (jekyll-seo-tag uses this for og:image / twitter:image).
image: /assets/og/home.png
logo: /assets/icons/favicon-192.png
social:
  name: Allamaprabhu Ani
  links:
    - https://github.com/allamaprabhuani
    - https://scholar.google.com/citations?user=dX3xKGsAAAAJ
    - https://orcid.org/0000-0003-1039-7622
    - https://www.linkedin.com/in/allamaprabhu-ani
    - https://www.citystgeorges.ac.uk/about/people/research-students/allamaprabhu-ani
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  syntax_highlighter: rouge
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/

defaults:
  - scope: { path: "", type: "tutorials" }
    values:
      layout: tutorial
  # Keep the GSC verification stub out of the sitemap (Google fetches it
  # by exact path; indexing it adds noise).
  - scope: { path: "google57dd859010581d7e.html" }
    values:
      sitemap: false
  # /assets and /notebooks are listing pages with no real content.
  - scope: { path: "assets" }
    values:
      sitemap: false
  - scope: { path: "notebooks" }
    values:
      sitemap: false

exclude:
  - README.md
  - assets/README.md
  - notebooks/README.md
  - ISSUES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - notebooks/.ipynb_checkpoints
