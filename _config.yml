title: Allamaprabhu Ani
description: Doctoral researcher in computational mechanics and deep learning at City, St George's, University of London. Building SynaCAD.
url: https://allamaprabhuani.github.io
author:
  name: Allamaprabhu S Ani
  email: allamaprabhuani@gmail.com

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  syntax_highlighter: rouge
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tutorials:
    output: true
    permalink: /tutorials/:path/

defaults:
  - scope: { path: "", type: "tutorials" }
    values:
      layout: tutorial
  # Keep the GSC verification stub out of the sitemap (Google fetches it
  # by exact path; indexing it adds noise).
  - scope: { path: "google57dd859010581d7e.html" }
    values:
      sitemap: false
  # /assets and /notebooks are listing pages with no real content.
  - scope: { path: "assets" }
    values:
      sitemap: false
  - scope: { path: "notebooks" }
    values:
      sitemap: false

exclude:
  - README.md
  - ISSUES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - notebooks/.ipynb_checkpoints
