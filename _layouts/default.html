<!-- Inline theme + background bootstrap (runs before CSS paint) -->
<script>
(function(){
  var TZ_LAT = {
    'Europe/London':51,'Europe/Dublin':53,'Europe/Paris':48,'Europe/Berlin':52,'Europe/Madrid':40,
    'Europe/Rome':41,'Europe/Amsterdam':52,'Europe/Stockholm':59,'Europe/Helsinki':60,'Europe/Athens':37,
    'Europe/Moscow':55,'Europe/Istanbul':41,'Asia/Kolkata':20,'Asia/Calcutta':22,'Asia/Karachi':24,
    'Asia/Dubai':25,'Asia/Tehran':35,'Asia/Tokyo':35,'Asia/Seoul':37,'Asia/Shanghai':31,
    'Asia/Hong_Kong':22,'Asia/Singapore':1,'Asia/Bangkok':13,'Asia/Jakarta':-6,
    'Australia/Sydney':-33,'Australia/Melbourne':-37,'Australia/Perth':-31,'Pacific/Auckland':-36,
    'America/New_York':40,'America/Toronto':43,'America/Chicago':41,'America/Denver':39,
    'America/Los_Angeles':34,'America/Vancouver':49,'America/Mexico_City':19,'America/Sao_Paulo':-23,
    'America/Buenos_Aires':-34,'Africa/Cairo':30,'Africa/Lagos':6,'Africa/Johannesburg':-26
  };
  function isAfterSunset() {
    try {
      var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      var lat = TZ_LAT[tz] != null ? TZ_LAT[tz] : 40;
      var now = new Date();
      var doy = Math.floor((now - new Date(now.getFullYear(),0,0))/86400000);
      var dec = 23.45 * Math.sin(2*Math.PI*(284+doy)/365) * Math.PI/180;
      var latR = lat * Math.PI/180;
      var cosH = -Math.tan(latR) * Math.tan(dec);
      var H = cosH > 1 ? 0 : cosH < -1 ? Math.PI : Math.acos(cosH);
      var dayH = H * 24 / Math.PI;
      var sunrise = 12 - dayH/2, sunset = 12 + dayH/2;
      var hr = now.getHours() + now.getMinutes()/60;
      return hr < sunrise || hr > sunset;
    } catch(e) { return false; }
  }
  var theme;
  try { theme = localStorage.getItem('theme'); } catch(e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = isAfterSunset() ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);

  // bg + accent: re-randomise on every refresh; ?bg=/?accent= URL params pin
  var BGS = ['aurora','grid','contours','constellation','sunrise','linen','shooting-stars','neural-net'];
  var ACCENTS = ['wine','burgundy-rose','magenta','eggplant','forest','olive','steel'];
  var qs;
  try { qs = new URL(location.href).searchParams; } catch(e) { qs = null; }
  var pinnedBg = qs && qs.get('bg');
  var pinnedAccent = qs && qs.get('accent');
  var bg     = (pinnedBg     && BGS.indexOf(pinnedBg)         !== -1) ? pinnedBg     : BGS[Math.floor(Math.random()*BGS.length)];
  var accent = (pinnedAccent && ACCENTS.indexOf(pinnedAccent) !== -1) ? pinnedAccent : ACCENTS[Math.floor(Math.random()*ACCENTS.length)];
  document.documentElement.setAttribute('data-bg', bg);
  document.documentElement.setAttribute('data-accent', accent);
})();
</script>
